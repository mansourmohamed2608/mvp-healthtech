name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: 'Environment to deploy to'
        required: false
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # ========================================
  # LINT JOBS (changed files only, strict)
  # ========================================
  lint-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get changed TS files
        id: changed-ts
        uses: tj-actions/changed-files@v44
        with:
          files: |
            gateway/src/**/*.ts
            gateway/test/**/*.ts
      - name: Skip lint (no TS changes)
        if: steps.changed-ts.outputs.any_changed != 'true'
        run: echo "No TypeScript files changed in gateway, skipping lint"
      - uses: actions/setup-node@v4
        if: steps.changed-ts.outputs.any_changed == 'true'
        with:
          node-version: 20
      - name: Install gateway deps
        if: steps.changed-ts.outputs.any_changed == 'true'
        working-directory: gateway
        run: npm ci --prefer-offline --no-audit
      - name: ESLint (changed files only, zero tolerance)
        if: steps.changed-ts.outputs.any_changed == 'true'
        working-directory: gateway
        run: |
          # Strip gateway/ prefix from file paths since we're in gateway/
          FILES=$(echo "${{ steps.changed-ts.outputs.all_changed_files }}" | tr ' ' '\n' | sed 's|^gateway/||' | tr '\n' ' ')
          echo "Linting files: $FILES"
          npx eslint $FILES --max-warnings=0

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get changed Python files
        id: changed-py
        uses: tj-actions/changed-files@v44
        with:
          files: |
            services/**/*.py
      - name: Skip lint (no Python changes)
        if: steps.changed-py.outputs.any_changed != 'true'
        run: echo "No Python files changed in services, skipping lint"
      - uses: actions/setup-python@v5
        if: steps.changed-py.outputs.any_changed == 'true'
        with:
          python-version: '3.11'
      - name: Install ruff
        if: steps.changed-py.outputs.any_changed == 'true'
        run: pip install ruff
      - name: Ruff lint (changed files only, strict)
        if: steps.changed-py.outputs.any_changed == 'true'
        run: |
          echo "Linting files: ${{ steps.changed-py.outputs.all_changed_files }}"
          ruff check ${{ steps.changed-py.outputs.all_changed_files }} --output-format=github

  # ========================================
  # SECURITY SCAN JOBS
  # ========================================
  security-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: npm audit (gateway)
        run: |
          cd gateway
          npm audit --audit-level=high || true

  security-pip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pip-audit
        run: pip install pip-audit
      - name: pip-audit (requirements)
        run: |
          pip-audit -r requirements-dev.txt --ignore-vuln GHSA-1234 || true

  security-trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy FS scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

  # ========================================
  # DATABASE MIGRATION
  # ========================================
  db-migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: healthtech
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations (idempotent)
        env:
          PGPASSWORD: testpass
        run: |
          for f in $(ls infra/db/migrations/*.sql | sort); do
            echo "Applying $f"
            psql -h localhost -U postgres -d healthtech -f "$f"
          done
      - name: Verify idempotency (second run must succeed)
        env:
          PGPASSWORD: testpass
        run: |
          for f in $(ls infra/db/migrations/*.sql | sort); do
            echo "Re-applying $f"
            psql -h localhost -U postgres -d healthtech -f "$f"
          done

  # ========================================
  # TEST JOBS
  # ========================================
  test:
    runs-on: ubuntu-latest
    needs: [lint-gateway, lint-python, db-migrate]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install gateway deps
        run: |
          cd gateway
          npm install
      - name: Run gateway tests
        run: |
          cd gateway
          npm test -- --runInBand
      - name: Install Python deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-pip libpq-dev
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-dev.txt
      - name: ASR tests
        run: |
          cd services/asr
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt -r ../../requirements-dev.txt
          INTERNAL_SECRET=test-internal pytest
      - name: LLM tests
        run: |
          cd services/llm
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt -r ../../requirements-dev.txt
          INTERNAL_SECRET=test-internal pytest
      - name: TTS tests
        run: |
          cd services/tts
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt -r ../../requirements-dev.txt
          INTERNAL_SECRET=test-internal pytest
      - name: SOAP tests
        run: |
          cd services/soap
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt -r ../../requirements-dev.txt
          INTERNAL_SECRET=test-internal pytest
      - name: FHIR tests
        run: |
          cd services/fhir
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt -r ../../requirements-dev.txt
          INTERNAL_SECRET=test-internal pytest
      - name: E2E smoke (gateway)
        run: |
          cd scripts
          JWT_SECRET=test-jwt-secret node e2e-smoke.js

  # ========================================
  # FRONTEND TESTS
  # ========================================
  test-frontend:
    runs-on: ubuntu-latest
    needs: [lint-gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install frontend deps
        working-directory: frontend-vite
        run: pnpm install --frozen-lockfile
      - name: Run Vitest
        working-directory: frontend-vite
        run: pnpm test:unit --run || true
      - name: Build frontend
        working-directory: frontend-vite
        run: pnpm build

  # ========================================
  # BUILD DOCKER IMAGES
  # ========================================
  build-gateway:
    runs-on: ubuntu-latest
    needs: [test, lint-gateway]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/gateway
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
      - name: Build and push Gateway image
        uses: docker/build-push-action@v5
        with:
          context: ./gateway
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    runs-on: ubuntu-latest
    needs: [test-frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-vite
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-services:
    runs-on: ubuntu-latest
    needs: [test, lint-python]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [asr, llm, llm-va, tts, soap, fhir, eval]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================
  # DEPLOY TO STAGING
  # ========================================
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build-gateway, build-frontend, build-services]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: ${{ secrets.STAGING_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Write runtime env file
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          HUGGINGFACE_HUB_TOKEN: ${{ secrets.HUGGINGFACE_HUB_TOKEN }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_API_KEY: ${{ secrets.TWILIO_API_KEY }}
          TWILIO_API_SECRET: ${{ secrets.TWILIO_API_SECRET }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          TWILIO_TWIML_APP_SID: ${{ secrets.TWILIO_TWIML_APP_SID }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.STAGING_CORS_ORIGINS }}
          GRAFANA_PASSWORD: ${{ secrets.GRAFANA_PASSWORD }}
        run: |
          cat > /tmp/deploy.env << EOF
          JWT_SECRET=${JWT_SECRET}
          INTERNAL_SECRET=${INTERNAL_SECRET}
          WS_SHARED_SECRET=${INTERNAL_SECRET}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          HUGGINGFACE_HUB_TOKEN=${HUGGINGFACE_HUB_TOKEN}
          TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
          TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
          TWILIO_API_KEY=${TWILIO_API_KEY}
          TWILIO_API_SECRET=${TWILIO_API_SECRET}
          TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
          TWILIO_TWIML_APP_SID=${TWILIO_TWIML_APP_SID}
          CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
          GRAFANA_PASSWORD=${GRAFANA_PASSWORD}
          EOF

      - name: Deploy to GCE (staging)
        env:
          GCE_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          GCE_ZONE: ${{ secrets.GCE_ZONE }}
          GCE_INSTANCE: ${{ secrets.GCE_STAGING_INSTANCE }}
          GIT_SHA: ${{ github.sha }}
        run: |
          # Copy runtime env to VM — secrets never stored in git
          gcloud compute scp /tmp/deploy.env \
            "${GCE_INSTANCE}:~/mvp-healthtech/infra/.env" \
            --zone="${GCE_ZONE}" --project="${GCE_PROJECT}" \
            --strict-host-key-checking=no

          # Deploy: checkout exact SHA, rebuild changed layers, rolling restart
          gcloud compute ssh "${GCE_INSTANCE}" \
            --zone="${GCE_ZONE}" --project="${GCE_PROJECT}" \
            --strict-host-key-checking=no \
            --command="
              set -euo pipefail
              cd ~/mvp-healthtech

              # Save rollback checkpoint
              git rev-parse HEAD > /tmp/pre-deploy-sha.txt
              docker compose -f infra/docker-compose.demo.yml images -q > /tmp/pre-deploy-images.txt 2>/dev/null || true

              git fetch origin
              git checkout ${GIT_SHA}

              cd infra
              docker compose -f docker-compose.demo.yml build gateway frontend
              docker compose -f docker-compose.demo.yml up -d

              echo 'Waiting 25s for NestJS compilation...'
              sleep 25

              if ! curl -sf http://localhost:3000/health > /dev/null; then
                echo '--- Gateway health FAILED — initiating rollback ---'
                PREV_SHA=\$(cat /tmp/pre-deploy-sha.txt)
                git checkout \${PREV_SHA}
                docker compose -f docker-compose.demo.yml up -d --build gateway
                echo 'ROLLBACK COMPLETE'
                exit 1
              fi
              echo 'Staging deployment successful'
            "

  # ========================================
  # DEPLOY TO PRODUCTION  (requires manual approval in GitHub environment settings)
  # ========================================
  deploy-production:
    runs-on: ubuntu-latest
    needs: [build-gateway, build-frontend, build-services]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ secrets.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Write runtime env file
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          HUGGINGFACE_HUB_TOKEN: ${{ secrets.HUGGINGFACE_HUB_TOKEN }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_API_KEY: ${{ secrets.TWILIO_API_KEY }}
          TWILIO_API_SECRET: ${{ secrets.TWILIO_API_SECRET }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          TWILIO_TWIML_APP_SID: ${{ secrets.TWILIO_TWIML_APP_SID }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.PRODUCTION_CORS_ORIGINS }}
          GRAFANA_PASSWORD: ${{ secrets.GRAFANA_PASSWORD }}
        run: |
          cat > /tmp/deploy.env << EOF
          JWT_SECRET=${JWT_SECRET}
          INTERNAL_SECRET=${INTERNAL_SECRET}
          WS_SHARED_SECRET=${INTERNAL_SECRET}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          HUGGINGFACE_HUB_TOKEN=${HUGGINGFACE_HUB_TOKEN}
          TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
          TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
          TWILIO_API_KEY=${TWILIO_API_KEY}
          TWILIO_API_SECRET=${TWILIO_API_SECRET}
          TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
          TWILIO_TWIML_APP_SID=${TWILIO_TWIML_APP_SID}
          CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
          GRAFANA_PASSWORD=${GRAFANA_PASSWORD}
          EOF

      - name: Deploy to GCE (production)
        env:
          GCE_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          GCE_ZONE: ${{ secrets.GCE_ZONE }}
          GCE_INSTANCE: ${{ secrets.GCE_PRODUCTION_INSTANCE }}
          GIT_SHA: ${{ github.sha }}
        run: |
          gcloud compute scp /tmp/deploy.env \
            "${GCE_INSTANCE}:~/mvp-healthtech/infra/.env" \
            --zone="${GCE_ZONE}" --project="${GCE_PROJECT}" \
            --strict-host-key-checking=no

          gcloud compute ssh "${GCE_INSTANCE}" \
            --zone="${GCE_ZONE}" --project="${GCE_PROJECT}" \
            --strict-host-key-checking=no \
            --command="
              set -euo pipefail
              cd ~/mvp-healthtech

              # Save rollback checkpoint
              git rev-parse HEAD > /tmp/pre-deploy-sha.txt

              git fetch origin
              git checkout ${GIT_SHA}

              cd infra
              docker compose -f docker-compose.demo.yml build gateway frontend
              docker compose -f docker-compose.demo.yml up -d

              echo 'Waiting 25s for NestJS compilation...'
              sleep 25

              if ! curl -sf http://localhost:3000/health > /dev/null; then
                echo '--- Gateway health FAILED — auto-rollback initiating ---'
                PREV_SHA=\$(cat /tmp/pre-deploy-sha.txt)
                git checkout \${PREV_SHA}
                docker compose -f docker-compose.demo.yml up -d --build gateway
                docker compose -f docker-compose.demo.yml up -d --build frontend
                echo 'AUTO-ROLLBACK COMPLETE to' \${PREV_SHA}
                exit 1
              fi
              echo 'Production deployment successful'
            "

  # ========================================
  # POST-DEPLOYMENT SMOKE TESTS
  # ========================================
  smoke-test-staging:
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Run smoke tests against staging
        env:
          BASE_URL: ${{ secrets.STAGING_URL }}
        run: |
          set -e
          echo "Running smoke tests against ${BASE_URL}"

          # 1. Gateway health
          curl -sf "${BASE_URL}/health" | grep -q 'ok\|healthy\|UP' || \
            { echo 'FAIL: /health'; exit 1; }

          # 2. Auth endpoint responds (not 502) — expect 401 for bad creds
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST "${BASE_URL}/auth/login" \
            -H 'Content-Type: application/json' \
            -d '{"userId":"smoke","password":"wrong"}')
          [ "$STATUS" = "401" ] || { echo "FAIL: /auth/login returned $STATUS (expected 401)"; exit 1; }

          # 3. Frontend HTML loads
          curl -sf "${BASE_URL}/" | grep -q '<html\|<!DOCTYPE' || \
            { echo 'FAIL: frontend did not return HTML'; exit 1; }

          echo 'All smoke tests passed.'

  smoke-test-production:
    runs-on: ubuntu-latest
    needs: [deploy-production]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Run smoke tests against production
        env:
          BASE_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          set -e
          echo "Running smoke tests against ${BASE_URL}"

          curl -sf "${BASE_URL}/health" | grep -q 'ok\|healthy\|UP' || \
            { echo 'FAIL: /health'; exit 1; }

          STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST "${BASE_URL}/auth/login" \
            -H 'Content-Type: application/json' \
            -d '{"userId":"smoke","password":"wrong"}')
          [ "$STATUS" = "401" ] || { echo "FAIL: /auth/login returned $STATUS (expected 401)"; exit 1; }

          curl -sf "${BASE_URL}/" | grep -q '<html\|<!DOCTYPE' || \
            { echo 'FAIL: frontend did not return HTML'; exit 1; }

          echo 'All smoke tests passed.'

  # ========================================
  # RELEASE
  # ========================================
  release:
    runs-on: ubuntu-latest
    needs: [smoke-test-production]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate changelog
        id: changelog
        uses: conventional-changelog/standard-version@master
        with:
          skip-commit: true
          skip-tag: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
