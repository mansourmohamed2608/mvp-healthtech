name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

permissions:
  contents: write
  packages: write

jobs:
  # ========================================
  # BUILD AND PUSH RELEASE IMAGES
  # ========================================
  build-release-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: gateway
            context: ./gateway
          - service: frontend
            context: ./frontend-vite
          - service: asr
            context: ./services/asr
          - service: llm
            context: ./services/llm
          - service: llm-va
            context: ./services/llm-va
          - service: tts
            context: ./services/tts
          - service: soap
            context: ./services/soap
          - service: fhir
            context: ./services/fhir
          - service: eval
            context: ./services/eval

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_SHA=${{ github.sha }}

  # ========================================
  # CREATE GITHUB RELEASE
  # ========================================
  create-release:
    runs-on: ubuntu-latest
    needs: [build-release-images]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [ -n "$PREV_TAG" ]; then
            echo "## Changes since $PREV_TAG" > CHANGELOG.md
            git log $PREV_TAG..HEAD --pretty=format:"- %s (%h)" >> CHANGELOG.md
          else
            echo "## Initial Release" > CHANGELOG.md
            git log --pretty=format:"- %s (%h)" >> CHANGELOG.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: CHANGELOG.md
          generate_release_notes: true
          files: |
            docker-compose.yml
            docker-compose.prod.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ========================================
  # DEPLOY RELEASE TO PRODUCTION
  # ========================================
  deploy-production:
    runs-on: ubuntu-latest
    needs: [create-release]
    environment:
      name: production
      url: https://healthtech.example.com
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Deploy to production
        run: |
          echo "Deploying version ${{ steps.version.outputs.VERSION }} to production..."
          # Add your production deployment commands here
          # Examples:
          # - kubectl set image deployment/gateway gateway=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/gateway:${{ steps.version.outputs.VERSION }}
          # - helm upgrade healthtech ./infra/helm --set image.tag=${{ steps.version.outputs.VERSION }}

      - name: Notify deployment
        run: |
          echo "Production deployment complete for version ${{ steps.version.outputs.VERSION }}"
          # Add Slack/Teams/Email notification here

  # ========================================
  # POST-DEPLOYMENT VERIFICATION
  # ========================================
  verify-deployment:
    runs-on: ubuntu-latest
    needs: [deploy-production]
    steps:
      - name: Wait for deployment
        run: sleep 60

      - name: Health checks
        run: |
          BASE_URL="https://healthtech.example.com"
          
          # Check main health endpoint
          curl -f "$BASE_URL/health" || exit 1
          
          # Check API health
          curl -f "$BASE_URL/api/health" || exit 1
          
          echo "All health checks passed!"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment verification failed! Consider rollback..."
          # Add rollback commands here
