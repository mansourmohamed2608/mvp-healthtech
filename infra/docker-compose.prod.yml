# docker-compose.prod.yml — PRODUCTION
# Internal services do NOT expose ports to host; only gateway/frontend exposed
version: '3.8'
services:
  gateway:
    build: ../gateway
    # OPS-03: uses the image built by the Dockerfile — no live source mount
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET:?set REFRESH_TOKEN_SECRET}
      - INTERNAL_SECRET=${INTERNAL_SECRET:?set INTERNAL_SECRET}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:?set TWILIO_AUTH_TOKEN}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/healthtech
      - OTEL_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318/v1/traces
      - ASR_SERVICE_URL=http://asr:5000
      - LLM_SERVICE_URL=http://llm:5001
      - TTS_SERVICE_URL=http://tts:5002
      - SOAP_SERVICE_URL=http://soap:5003
      - FHIR_SERVICE_URL=http://fhir:5004
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://your-domain.com}
      - MULTI_TENANT=${MULTI_TENANT:-true}
      - FRONTEND_URL=${FRONTEND_URL:-https://your-domain.com}
      # OIDC \u2014 optional; leave unset to disable SSO (password auth still works)
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_CALLBACK_URL=${OIDC_CALLBACK_URL:-}
      - OIDC_AUTHORIZATION_URL=${OIDC_AUTHORIZATION_URL:-}
      - OIDC_TOKEN_URL=${OIDC_TOKEN_URL:-}
      - OIDC_USERINFO_URL=${OIDC_USERINFO_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      asr:
        condition: service_started
      llm:
        condition: service_started
      tts:
        condition: service_started
      soap:
        condition: service_started
      fhir:
        condition: service_started
      redis:
        condition: service_started
      db-migrate:
        condition: service_completed_successfully

  frontend-vite:
    build:
      context: ../frontend-vite
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-}
        - VITE_OIDC_ENABLED=${VITE_OIDC_ENABLED:-false}
    depends_on:
      - gateway
    ports:
      - "5173:80"

  # === INTERNAL SERVICES — NO EXPOSED PORTS ===
  asr:
    build: ../services/asr
    # NO ports exposed - internal only
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET:?set INTERNAL_SECRET}
      - TRANSFORMERS_CACHE=/cache
      - OTEL_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318/v1/traces
      - CORS_ALLOWED_ORIGINS=http://gateway:3000
    volumes:
      - huggingface_cache:/cache

  llm:
    build: ../services/llm
    # NO ports exposed - internal only
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET:?set INTERNAL_SECRET}
      - TRANSFORMERS_CACHE=/cache
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=va_rag
      - OTEL_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318/v1/traces
      - CORS_ALLOWED_ORIGINS=http://gateway:3000
      - GUARDRAILS_FAIL_OPEN=false
    volumes:
      - huggingface_cache:/cache

  llm-va:
    build: ../services/llm-va
    # NO ports exposed - internal only
    environment:
      - VA_MODEL=Qwen/Qwen2.5-3B-Instruct
      - INTERNAL_SECRET=${INTERNAL_SECRET:?set INTERNAL_SECRET}
      - RAG_SERVICE_URL=http://llm:5001
      - OTEL_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318/v1/traces
      - CORS_ALLOWED_ORIGINS=http://gateway:3000
    volumes:
      - huggingface_cache:/cache

  tts:
    build: ../services/tts
    # NO ports exposed - internal only
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET:?set INTERNAL_SECRET}
      - PYTORCH_ENABLE_MPS_FALLBACK=1
      - OTEL_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318/v1/traces
      - CORS_ALLOWED_ORIGINS=http://gateway:3000
    # no source-code volumes — service runs from container image

  soap:
    build: ../services/soap
    # NO ports exposed - internal only
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/healthtech
      - INTERNAL_SECRET=${INTERNAL_SECRET:?set INTERNAL_SECRET}
      - OTEL_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318/v1/traces
      - CORS_ALLOWED_ORIGINS=http://gateway:3000
    # no source-code volumes — service runs from container image

  soap-worker:
    build:
      context: ../services/soap
      dockerfile: Dockerfile.worker
    environment:
      - SOAP_QUEUE_URL=redis://redis:6379/0
      - SOAP_SERVICE_URL=http://soap:5003
      - INTERNAL_SECRET=${INTERNAL_SECRET:?set INTERNAL_SECRET}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/healthtech
    depends_on:
      - soap
      - redis

  fhir:
    build: ../services/fhir
    # NO ports exposed - internal only
    environment:
      - FHIR_BASE_URL=${FHIR_BASE_URL:?set FHIR_BASE_URL}
      - FHIR_CLIENT_ID=${FHIR_CLIENT_ID:?set FHIR_CLIENT_ID}
      - FHIR_CLIENT_SECRET=${FHIR_CLIENT_SECRET:?set FHIR_CLIENT_SECRET}
      - FHIR_BEARER_TOKEN=${FHIR_BEARER_TOKEN:-}
      - FHIR_BASIC_AUTH_USER=${FHIR_BASIC_AUTH_USER:-}
      - FHIR_BASIC_AUTH_PASSWORD=${FHIR_BASIC_AUTH_PASSWORD:-}
      - INTERNAL_SECRET=${INTERNAL_SECRET:?set INTERNAL_SECRET}
      - OTEL_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318/v1/traces
      - CORS_ALLOWED_ORIGINS=http://gateway:3000
    # no source-code volumes — service runs from container image

  orchestrator:
    build: ../services/llm
    command: python orchestrator.py
    # NO ports exposed - internal only
    environment:
      - LLM_ENDPOINT=http://llm:5001/infer
      - CLINICAL_LLM_URL=http://llm:5001
      - VA_LLM_URL=http://llm-va:5007
      - TRANSFORMERS_CACHE=/cache
      - INTERNAL_SECRET=${INTERNAL_SECRET:?set INTERNAL_SECRET}
    volumes:
      - huggingface_cache:/cache
    depends_on:
      - llm
      - llm-va

  redis:
    image: redis:7
    # NO ports exposed - internal only

  prometheus:
    image: prom/prometheus:latest
    # NO ports exposed - internal only
    volumes:
      - ../infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - gateway
      - asr
      - llm
      - tts
      - llm-va
      - orchestrator

  loki:
    image: grafana/loki:2.9.0
    command: -config.file=/etc/loki/loki.yml
    # NO ports exposed - internal only
    volumes:
      - ../infra/observability/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki

  promtail:
    image: grafana/promtail:2.9.0
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ../infra/observability/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3002:3000"  # Grafana exposed for monitoring
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ../infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki

  otel-collector:
    image: otel/opentelemetry-collector:latest
    command: ["--config=/etc/otel-collector.yml"]
    # NO ports exposed - internal only
    volumes:
      - ../infra/observability/otel-collector.yml:/etc/otel-collector.yml:ro

  qdrant:
    image: qdrant/qdrant:latest
    # NO ports exposed - internal only
    volumes:
      - qdrant_storage:/qdrant/storage

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      - POSTGRES_DB=healthtech
    volumes:
      - ../infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d healthtech"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # NO ports exposed - internal only

  # One-shot: runs all migration files in order before any app service starts.
  # Idempotent — safe to run on every deploy (migrations use IF NOT EXISTS / IF NOT EXISTS).
  db-migrate:
    image: postgres:16
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        for f in $(ls /migrations/*.sql | sort); do
          echo "Applying $$f"
          psql -h postgres -U postgres -d healthtech -f "$$f"
        done
        echo "All migrations applied."
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ../infra/db/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # One-shot job: upserts the initial admin user on first deploy.
  # Re-running is safe (ON CONFLICT DO UPDATE). Exits 0 on success.
  # Set SEED_ADMIN_PASSWORD via environment or .env file.
  seed-init:
    build:
      context: ../scripts
      dockerfile: Dockerfile.seed
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/healthtech
      - SEED_ADMIN_USER=${SEED_ADMIN_USER:-admin}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD}
      - SEED_ADMIN_ROLES=${SEED_ADMIN_ROLES:-admin,clinician}
      - SEED_ADMIN_TENANT=${SEED_ADMIN_TENANT:-default}
      - NODE_ENV=production
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  huggingface_cache:
  prometheus_data:
  loki_data:
  grafana_data:
  qdrant_storage:
