version: '3.8'
services:
  gateway:
    build: ../gateway
    working_dir: /app
    command: sh -lc "pnpm install && pnpm start:dev"
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - JWT_SECRET=change_me
      - TWILIO_AUTH_TOKEN=change_me
      - ASR_SERVICE_URL=http://asr:5000
      - LLM_SERVICE_URL=http://llm:5001
      - TTS_SERVICE_URL=http://tts:5002
      - SOAP_SERVICE_URL=http://soap:5003
      - FHIR_SERVICE_URL=http://fhir:5004
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ../gateway:/app
      - gateway_node_modules:/app/node_modules
    depends_on:
      - asr
      - llm
      - tts
      - soap
      - fhir
      - redis

  frontend-vite:
    build: ../frontend-vite
    working_dir: /app
    command: sh -lc "pnpm install && pnpm dev --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:3001
    volumes:
      - ../frontend-vite:/app
      - frontend_vite_node_modules:/app/node_modules

  asr:
    build: ../services/asr
    ports:
      - "5000:5000"
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]  # remove if no GPU
    environment:
      - TRANSFORMERS_CACHE=/cache
    volumes:
      - ../services/asr:/app
      - ../services/asr/lora_ckpt:/app/lora_ckpt
      - huggingface_cache:/cache

  llm:
    build: ../services/llm
    ports:
      - "5001:5001"
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    environment:
      - TRANSFORMERS_CACHE=/cache
    volumes:
      - ../services/llm:/app
      - ../services/llm/data:/app/data
      - huggingface_cache:/cache

  tts:
    build: ../services/tts
    ports:
      - "5002:5002"
    environment:
      - PYTORCH_ENABLE_MPS_FALLBACK=1
    volumes:
      - ../services/tts:/app

  soap:
    build: ../services/soap
    ports:
      - "5003:5003"
    volumes:
      - ../services/soap:/app

  fhir:
    build: ../services/fhir
    ports:
      - "5004:5004"
    environment:
      - FHIR_BASE_URL=${FHIR_BASE_URL:-https://fhir.example.com}
      - FHIR_CLIENT_ID=${FHIR_CLIENT_ID:-}
      - FHIR_CLIENT_SECRET=${FHIR_CLIENT_SECRET:-}
    volumes:
      - ../services/fhir:/app

  orchestrator:
    build: ../services/llm
    command: python orchestrator.py
    ports:
      - "5006:5006"
    environment:
      - LLM_ENDPOINT=http://llm:5001/infer
      - TRANSFORMERS_CACHE=/cache
    volumes:
      - ../services/llm:/app
      - huggingface_cache:/cache
    depends_on:
      - llm

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16
    environment:
     - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"

volumes:
  gateway_node_modules:
  frontend_vite_node_modules:
  huggingface_cache:
