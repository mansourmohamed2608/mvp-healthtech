version: '3.8'
services:
  gateway:
    build: ../gateway
    working_dir: /app
    command: sh -lc "pnpm install && pnpm start:dev"
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:?set TWILIO_AUTH_TOKEN}
      - ASR_SERVICE_URL=http://asr:5000
      - LLM_SERVICE_URL=http://llm:5001
      - TTS_SERVICE_URL=http://tts:5002
      - SOAP_SERVICE_URL=http://soap:5003
      - FHIR_SERVICE_URL=http://fhir:5004
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ../gateway:/app
      - gateway_node_modules:/app/node_modules
    depends_on:
      - asr
      - llm
      - tts
      - soap
      - fhir
      - redis

  frontend-vite:
    build:
      context: ../frontend-vite
      dockerfile: Dockerfile
    depends_on:
      - gateway
    environment:
      - VITE_API_URL=http://gateway:3000
    ports:
      - "5173:80"

  asr:
    build: ../services/asr
    ports:
      - "5000:5000"
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]  # remove if no GPU
    environment:
      - TRANSFORMERS_CACHE=/cache
    volumes:
      - ../services/asr:/app
      - ../services/asr/lora_ckpt:/app/lora_ckpt
      - huggingface_cache:/cache

  llm:
    build: ../services/llm
    ports:
      - "5001:5001"
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    environment:
      - TRANSFORMERS_CACHE=/cache
    volumes:
      - ../services/llm:/app
      - ../services/llm/data:/app/data
      - huggingface_cache:/cache

  llm-va:
    build: ../services/llm-va
    ports:
      - "5007:5007"
    environment:
      - VA_MODEL=Qwen/Qwen2.5-3B-Instruct
      - INTERNAL_SECRET=${INTERNAL_SECRET:?set INTERNAL_SECRET}
    volumes:
      - ../services/llm-va:/app
      - huggingface_cache:/cache

  tts:
    build: ../services/tts
    ports:
      - "5002:5002"
    environment:
      - PYTORCH_ENABLE_MPS_FALLBACK=1
    volumes:
      - ../services/tts:/app

  soap:
    build: ../services/soap
    ports:
      - "5003:5003"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/healthtech
      - INTERNAL_SECRET=${INTERNAL_SECRET:?set INTERNAL_SECRET}
    volumes:
      - ../services/soap:/app

  soap-worker:
    build:
      context: ../services/soap
      dockerfile: Dockerfile.worker
    environment:
      - SOAP_QUEUE_URL=redis://redis:6379/0
      - SOAP_SERVICE_URL=http://soap:5003
      - INTERNAL_SECRET=${INTERNAL_SECRET:?set INTERNAL_SECRET}
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/healthtech
    depends_on:
      - soap
      - redis

  fhir:
    build: ../services/fhir
    ports:
      - "5004:5004"
    environment:
      - FHIR_BASE_URL=${FHIR_BASE_URL:?set FHIR_BASE_URL}
      - FHIR_CLIENT_ID=${FHIR_CLIENT_ID:?set FHIR_CLIENT_ID}
      - FHIR_CLIENT_SECRET=${FHIR_CLIENT_SECRET:?set FHIR_CLIENT_SECRET}
      - FHIR_BEARER_TOKEN=${FHIR_BEARER_TOKEN:-}
      - FHIR_BASIC_AUTH_USER=${FHIR_BASIC_AUTH_USER:-}
      - FHIR_BASIC_AUTH_PASSWORD=${FHIR_BASIC_AUTH_PASSWORD:-}
      - INTERNAL_SECRET=${INTERNAL_SECRET:?set INTERNAL_SECRET}
    volumes:
      - ../services/fhir:/app

  orchestrator:
    build: ../services/llm
    command: python orchestrator.py
    ports:
      - "5006:5006"
    environment:
      - LLM_ENDPOINT=http://llm:5001/infer
      - CLINICAL_LLM_URL=http://llm:5001
      - VA_LLM_URL=http://llm-va:5007
      - TRANSFORMERS_CACHE=/cache
      - INTERNAL_SECRET=${INTERNAL_SECRET:?set INTERNAL_SECRET}
    volumes:
      - ../services/llm:/app
      - huggingface_cache:/cache
    depends_on:
      - llm
      - llm-va

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=healthtech
    volumes:
      - ../infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"

  retention:
    build: ../services/eval
    command: ["python", "retention_job.py"]
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/healthtech
      - PHI_RETENTION_DAYS=${PHI_RETENTION_DAYS:-90}
      - DRY_RUN=${RETENTION_DRY_RUN:-false}
    depends_on:
      - postgres

volumes:
  gateway_node_modules:
  frontend_vite_node_modules:
  huggingface_cache:
