# docker-compose.demo.yml — INVESTOR DEMO on GCE L4
# Optimized for low latency and high accuracy
# Single L4 GPU (24GB VRAM) - plenty for ASR + LLM sequential processing

services:
  # ============ FRONTEND ============
  frontend:
    build:
      context: ../frontend-vite
      dockerfile: Dockerfile
    ports:
      - "5173:80"    # System nginx reverse-proxies this port to :443
    environment:
      - VITE_API_URL=http://gateway:3000
    depends_on:
      - gateway
    restart: unless-stopped

  # ============ API GATEWAY ============
  gateway:
    build: ../gateway
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - WS_SHARED_SECRET=${WS_SHARED_SECRET:-${INTERNAL_SECRET}}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_API_KEY=${TWILIO_API_KEY}
      - TWILIO_API_SECRET=${TWILIO_API_SECRET}
      - TWILIO_TWIML_APP_SID=${TWILIO_TWIML_APP_SID}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
      - GATEWAY_PUBLIC_URL=${GATEWAY_PUBLIC_URL:-https://34-26-235-26.nip.io}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/healthtech
      - ASR_SERVICE_URL=http://asr:5000
      - LLM_SERVICE_URL=http://llm:5001
      - ORCHESTRATOR_URL=http://orchestrator:5006
      - VA_LLM_URL=http://llm-va:5007
      - TTS_SERVICE_URL=http://tts:5002
      - SOAP_SERVICE_URL=http://soap:5003
      - FHIR_SERVICE_URL=http://fhir:5004
      - FHIR_BASE_URL=http://fhir:5004
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://34-26-235-26.nip.io,http://localhost:5173,http://localhost:3000}
      - ENABLE_DEV_TENANT_FALLBACK=true
      - MULTI_TENANT=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      asr:
        condition: service_healthy
      llm:
        condition: service_healthy
      llm-va:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ============ ASR SERVICE (GPU) ============
  # WhisperX large-v3 for high accuracy Arabic transcription
  asr:
    build: ../services/asr
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 16G
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - TRANSFORMERS_CACHE=/cache
      - HF_HOME=/cache
      - HUGGINGFACE_HUB_TOKEN=${HUGGINGFACE_HUB_TOKEN}
      # High accuracy settings
      - WHISPER_MODEL=large-v3
      - WHISPER_COMPUTE_TYPE=float16
      - WHISPER_BATCH_SIZE=16
      - ENABLE_DIARIZATION=true
      - ENABLE_VAD=true
      # Performance tuning
      - CUDA_VISIBLE_DEVICES=0
      - OMP_NUM_THREADS=4
    volumes:
      - huggingface_cache:/cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 120s  # Models take time to load

  # ============ LLM SERVICE (GPU) ============
  # MMed-Llama-3-8B for medical SOAP generation
  llm:
    build: ../services/llm
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 16G
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - TRANSFORMERS_CACHE=/cache
      - HF_HOME=/cache
      - HUGGINGFACE_HUB_TOKEN=${HUGGINGFACE_HUB_TOKEN}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=va_rag
      # High accuracy settings - use 8-bit for L4's 24GB VRAM
      - LOAD_IN_8BIT=true
      - LOAD_IN_4BIT=false
      - MAX_NEW_TOKENS=1024
      # Guardrails enabled
      - GUARDRAILS_FAIL_OPEN=false
      - REDIS_URL=redis://redis:6379/0
      # Performance
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - huggingface_cache:/cache
      - llm_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 180s  # LLM takes longer to load

  # ============ LLM-VA SERVICE (GPU) ============
  # Qwen2.5-3B-Instruct for Voice Agent Arabic dialogue
  llm-va:
    build: ../services/llm-va
    ports:
      - "127.0.0.1:5007:5007"   # loopback only — enables SSH tunnel for demo
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 16G
    environment:
      - VA_MODEL=Qwen/Qwen2.5-3B-Instruct
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - RAG_SERVICE_URL=http://llm:5001
      - VA_DEVICE=cuda
      - VA_DTYPE=float16
      - HUGGINGFACE_HUB_TOKEN=${HUGGINGFACE_HUB_TOKEN}
      - HF_HOME=/cache
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - huggingface_cache:/cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5007/health')\""]
      interval: 60s
      timeout: 30s
      retries: 10
      start_period: 600s  # 10 minutes for first-time model download

  # ============ TTS SERVICE (CPU) ============
  # edge-tts - cloud-based, no GPU needed
  tts:
    build: ../services/tts
    ports:
      - "127.0.0.1:5002:5002"   # loopback only — enables SSH tunnel for demo
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - TTS_ENGINE=xtts
      - TTS_MODEL_DIR=/app/models
      - EDGE_TTS_ALLOWED=true
      - TTS_EDGE_VOICE=ar-SA-HamedNeural
      - TTS_TIMEOUT_SECONDS=45
    volumes:
      - tts_models:/app/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5002/health')\""]
      interval: 30s
      timeout: 10s
      retries: 5

  # ============ SOAP SERVICE (CPU) ============
  soap:
    build: ../services/soap
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/healthtech
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - LLM_SERVICE_URL=http://llm:5001
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5003/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============ FHIR SERVICE (CPU) ============
  fhir:
    build: ../services/fhir
    environment:
      - FHIR_BASE_URL=${FHIR_BASE_URL:-http://localhost:5004}
      - FHIR_CLIENT_ID=${FHIR_CLIENT_ID:-demo}
      - FHIR_CLIENT_SECRET=${FHIR_CLIENT_SECRET:-demo}
      - FHIR_BEARER_TOKEN=${FHIR_BEARER_TOKEN:-}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/healthtech
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5004/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============ DATABASES ============
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=healthtech
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: run all SQL migration files before gateway starts
  db-migrate:
    image: postgres:16
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        for f in $(ls /migrations/*.sql | sort); do
          echo "Applying $$f"
          psql -h postgres -U postgres -d healthtech -f "$$f"
        done
        echo "All migrations applied."
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ../infra/db/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # One-shot: seed/upsert demo admin user after migrations
  seed-init:
    build:
      context: ../scripts
      dockerfile: Dockerfile.seed
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/healthtech
      - SEED_ADMIN_USER=${SEED_ADMIN_USER:-demo}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD}
      - SEED_ADMIN_ROLES=${SEED_ADMIN_ROLES:-admin,clinician}
      - SEED_ADMIN_TENANT=${SEED_ADMIN_TENANT:-default}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    restart: "no"

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # ============ MONITORING (Optional) ============
  prometheus:
    image: prom/prometheus:latest
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    volumes:
      - ../infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../infra/observability/alerting-rules.yml:/etc/prometheus/alerting-rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector-config.yml"]
    environment:
      - NODE_ENV=${NODE_ENV:-demo}
    volumes:
      - ../infra/observability/otel-collector.yml:/etc/otel-collector-config.yml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus metrics scrape endpoint
      - "13133:13133" # Health check
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-demo123}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ALERTING_ENABLED=true
      - GF_UNIFIED_ALERTING_ENABLED=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ../infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  huggingface_cache:
  llm_data:
  grafana_data:
  prometheus_data:
  tts_models:

networks:
  default:
    driver: bridge
