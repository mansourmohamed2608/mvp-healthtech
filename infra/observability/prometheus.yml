global:
  scrape_interval: 10s
  evaluation_interval: 10s

# Alert rules
rule_files:
  - /etc/prometheus/alerting-rules.yml

# Alertmanager configuration (uncomment when alertmanager is deployed)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#             - alertmanager:9093

scrape_configs:
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:3000"]

  - job_name: asr
    metrics_path: /metrics
    static_configs:
      - targets: ["asr:5000"]

  - job_name: llm
    metrics_path: /metrics
    static_configs:
      - targets: ["llm:5001"]

  - job_name: tts
    metrics_path: /metrics
    static_configs:
      - targets: ["tts:5002"]

  - job_name: soap
    metrics_path: /metrics
    static_configs:
      - targets: ["soap:5003"]

  - job_name: fhir
    metrics_path: /metrics
    static_configs:
      - targets: ["fhir:5004"]

  - job_name: llm-va
    metrics_path: /metrics
    static_configs:
      - targets: ["llm-va:5007"]

  - job_name: orchestrator
    metrics_path: /metrics
    static_configs:
      - targets: ["orchestrator:5006"]

  - job_name: otel-collector
    metrics_path: /metrics
    static_configs:
      - targets: ["otel-collector:8889"]
