# Grafana Alerting Provisioning
# Grafana 9+ format — auto-loaded from provisioning/alerting/
# Reference: https://grafana.com/docs/grafana/latest/alerting/set-up/provision-alerting-resources/file-provisioning/

apiVersion: 1

# ==========================================
# CONTACT POINTS
# ==========================================
contactPoints:
  - orgId: 1
    name: ops-email
    receivers:
      - uid: ops-email-receiver
        type: email
        settings:
          addresses: ops@example.com
          singleEmail: false
        disableResolveMessage: false

# ==========================================
# NOTIFICATION POLICIES
# ==========================================
policies:
  - orgId: 1
    receiver: ops-email       # default receiver
    group_by: [alertname, service]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      # Critical alerts → immediate, shorter repeat
      - receiver: ops-email
        matchers:
          - severity = critical
        group_wait: 0s
        group_interval: 1m
        repeat_interval: 30m
        continue: false

      # Security alerts → also email
      - receiver: ops-email
        matchers:
          - alertname =~ "BruteForce.*|MissingTenantId.*|JWT.*"
        continue: false

